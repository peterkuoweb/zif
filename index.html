    <script>// js/db.js
const DB_NAME = 'OpensiaDB';
const DB_VERSION = 1;

let db;

/**
 * Initializes the IndexedDB.
 * Returns a promise that resolves when the DB is ready.
 */
function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onerror = (event) => {
            console.error("Database error: ", event.target.error);
            reject(event.target.error);
        };

        request.onsuccess = (event) => {
            db = event.target.result;
            resolve(db);
        };

        request.onupgradeneeded = (event) => {
            const db = event.target.result;

            // Store for settings
            if (!db.objectStoreNames.contains('settings')) {
                db.createObjectStore('settings', { keyPath: 'key' });
            }

            // Store for file explorer items (folders and notebooks)
            if (!db.objectStoreNames.contains('items')) {
                const itemsStore = db.createObjectStore('items', { keyPath: 'id' });
                itemsStore.createIndex('parentId', 'parentId', { unique: false });
                itemsStore.createIndex('type', 'type', { unique: false }); // 'folder' or 'notebook'
            }

            // Store for sources (files uploaded to a notebook)
            if (!db.objectStoreNames.contains('sources')) {
                const sourcesStore = db.createObjectStore('sources', { keyPath: 'id' });
                sourcesStore.createIndex('notebookId', 'notebookId', { unique: false });
            }

            // Store for chat messages
            if (!db.objectStoreNames.contains('messages')) {
                const messagesStore = db.createObjectStore('messages', { keyPath: 'id' });
                messagesStore.createIndex('notebookId', 'notebookId', { unique: false });
            }
        };
    });
}

// --- Settings CRUD ---

async function saveSetting(key, value) {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(['settings'], 'readwrite');
        const store = transaction.objectStore('settings');
        const request = store.put({ key, value });
        request.onsuccess = () => resolve();
        request.onerror = (e) => reject(e.target.error);
    });
}

async function getSetting(key) {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(['settings'], 'readonly');
        const store = transaction.objectStore('settings');
        const request = store.get(key);
        request.onsuccess = () => resolve(request.result ? request.result.value : null);
        request.onerror = (e) => reject(e.target.error);
    });
}

// --- Items (Folders/Notebooks) CRUD ---

async function addItem(item) {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(['items'], 'readwrite');
        const store = transaction.objectStore('items');
        const request = store.add(item);
        request.onsuccess = () => resolve(item);
        request.onerror = (e) => reject(e.target.error);
    });
}

async function updateItem(item) {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(['items'], 'readwrite');
        const store = transaction.objectStore('items');
        const request = store.put(item);
        request.onsuccess = () => resolve(item);
        request.onerror = (e) => reject(e.target.error);
    });
}

async function getItems() {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(['items'], 'readonly');
        const store = transaction.objectStore('items');
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e.target.error);
    });
}

async function deleteItem(id) {
    // Also recursively delete children if it's a folder, but for simplicity we'll just delete the item here.
    // In a real app, you'd cascade deletes.
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(['items'], 'readwrite');
        const store = transaction.objectStore('items');
        const request = store.delete(id);
        request.onsuccess = () => resolve();

            'Content-Type': 'application/json'
        })
    }

/**
 * Fetches available models for a given provider and API key.
 */
async function fetchModels(providerId, apiKey) {
    const provider = providers[providerId];
    if (!provider) throw new Error('未知的供應商');

    try {
        let url = provider.baseUrl + provider.modelsEndpoint;
        let options = {
            method: 'GET',
            headers: provider.headers(apiKey)
        };

        if (providerId === 'google') {
             url = provider.baseUrl + provider.modelsEndpoint + apiKey;
        }

        const response = await fetch(url, options);

        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        // Format the models list to a unified structure [{id, name}]
        let models = [];
        if (providerId === 'openai' || providerId === 'groq') {
             models = data.data.map(m => ({ id: m.id, name: m.id }));
             // Filter out non-chat models roughly for OpenAI
             if (providerId === 'openai') {
                 models = models.filter(m => m.id.includes('gpt'));
             }
        } else if (providerId === 'google') {
             models = data.models
                .filter(m => m.supportedGenerationMethods.includes('generateContent'))
                .map(m => ({ id: m.name.replace('models/', ''), name: m.displayName || m.name.replace('models/', '') }));
        }

        return models;

    } catch (error) {
        console.error("Error fetching models:", error);
        throw new Error(`無法獲取模型: ${error.message}`);
    }
}

/**
 * Sends a chat completion request to the AI provider.
 */
async function generateCompletion(providerId, apiKey, model, messages, systemPrompt = null) {
     const provider = providers[providerId];
     if (!provider) throw new Error('未知的供應商');

     try {
         if (providerId === 'openai' || providerId === 'groq') {
             const apiMessages = [...messages];
             if (systemPrompt) {
                 apiMessages.unshift({ role: 'system', content: systemPrompt });
             }

             const response = await fetch(provider.baseUrl + provider.chatEndpoint, {
                 method: 'POST',
                 headers: provider.headers(apiKey),
                 body: JSON.stringify({
                     model: model,
                     messages: apiMessages
                 })
             });

             if (!response.ok) throw new Error(`API Error: ${response.status}`);
             const data = await response.json();
             return data.choices[0].message.content;

         } else if (providerId === 'google') {
             // Convert generic message format to Gemini format
             let contents = messages.map(msg => ({
                 role: msg.role === 'user' ? 'user' : 'model',
                 parts: [{ text: msg.content }]
             }));

             const payload = { contents: contents };
             if (systemPrompt) {
                 // Gemini system instructions (supported on newer models)
                 payload.systemInstruction = {
                     parts: [{ text: systemPrompt }]
                 };
             }

             const url = provider.baseUrl + provider.chatEndpoint(model, apiKey);
             const response = await fetch(url, {
                 method: 'POST',
                 headers: provider.headers(),
                 body: JSON.stringify(payload)
             });

             if (!response.ok) throw new Error(`API Error: ${response.status}`);
             const data = await response.json();
             return data.candidates[0].content.parts[0].text;
         }

     } catch (error) {
         console.error("Error generating completion:", error);
         throw new Error(`產生回應失敗: ${error.message}`);
     }
}

/**
 * Helper to process file content and generate a summary
 */
async function summarizeDocument(providerId, apiKey, model, text, filename) {
    const systemPrompt = `你是一個專業的文件分析助手。你的任務是將使用者上傳的文件整理成純文字格式。

重要指示：
1. 請保留所有重要細節，這不是一個簡短的摘要，而是一個「結構化、詳細的文字轉換」。
2. 絕對不能漏掉任何資訊，因為使用者未來會依靠這些文字來搜尋細節。
3. 如果文件中有提到「頁碼」、「章節」、「條目」，請務必標示清楚（例如：[第5頁]、[第二章]）。
4. 請使用 Markdown 格式來組織內容，使其易於閱讀（使用標題、列表、粗體等）。
5. 盡可能保持原文的語氣和邏輯結構。`;

    const prompt = `請整理以下名為「${filename}」的文件內容：

${text.substring(0, 30000)}`; // Limit length basic

    return await generateCompletion(providerId, apiKey, model, [{role: 'user', content: prompt}], systemPrompt);

    const activeSourcesData = app.sources.filter(s => app.activeSourceIds.includes(s.id));

    activeSourcesData.forEach(s => {
        contextText += `--- 檔案：${s.name} ---
${s.summary}

`;
    });

    let systemInstruction = "";
    let userPrompt = contextText + "\n\n";

    if (type === 'video') {
        const length = document.getElementById('labLength').value;
        systemInstruction = "你是一個專業的影片腳本編輯與前端開發者。請根據提供的來源資料，產生一個可以用來當作「影片解說」的 HTML 結構，以及對應的「旁白文字」。";
        userPrompt += `
            語言: ${lang}
            長度: ${length}
            自訂要求: ${prompt}

            請嚴格輸出一個 JSON 格式，包含兩個陣列：

            注意：HTML 應該是可以直接放在一個 container 裡的內容，不需要 <html> 或 <body> 標籤。

            格式範例:
            {
              "slides": [
                {
                  "html": "<div class='bg-blue-50 p-8 rounded-3xl text-center'><h1 class='text-4xl font-bold text-blue-800'>標題</h1></div>",

              ]

        `;

        const response = await generateCompletion(app.settings.provider, app.settings.apiKey, app.settings.model, [{role: 'user', content: userPrompt}], systemInstruction);

    } else if (type === 'podcast') {

            格式範例:
            [
              {"speaker": "host", "text": "歡迎收聽今天的節目！"},
              {"speaker": "guest", "text": "大家好，很高興來到這裡。"}
            ]
            只輸出 JSON。
        `;

        const response = await generateCompletion(app.settings.provider, app.settings.apiKey, app.settings.model, [{role: 'user', content: userPrompt}], systemInstruction);
        const data = parseJsonSafely(response);

    } else if (type === 'mindmap') {
        const detail = document.getElementById('labDetail').value;
        systemInstruction = "你是一個整理大師。請將來源資料轉換為 Mermaid.js 的 mindmap 語法。";
        userPrompt += `
            語言: ${lang}

            語法開頭必須是 mindmap。
            請確保語法正確，避免特殊字元破壞解析。
        `;

        const response = await generateCompletion(app.settings.provider, app.settings.apiKey, app.settings.model, [{role: 'user', content: userPrompt}], systemInstruction);
        const cleanMermaid = response.replace(/```mermaid/gi, '').replace(/```/g, '').trim();
        renderMindmap(cleanMermaid);

    } else if (type === 'presentation') {
        const pages = document.getElementById('labPages').value;
        systemInstruction = "你是一個專業的簡報設計師。請根據來源資料，製作一份簡報。";
        userPrompt += `
            語言: ${lang}
            頁面數量: 約 ${pages} 頁
            自訂要求: ${prompt}

            請輸出一個 JSON 陣列，每個物件代表一頁簡報，包含 'html' 欄位。
            'html' 的內容應該是使用 Tailwind CSS 設計的精美簡報單頁。
            風格需保持一致，背景淺色柔和，圓角設計。適當地在適合的地方加入一些 FontAwesome 圖標 (<i class="fas fa-..."></i>) 作為插圖點綴。
            不需包含 <html> <body> 標籤，只需一個滿版的 div 作為容器。

            格式範例:
            [
              {"html": "<div class='flex flex-col items-center justify-center h-full bg-indigo-50'><i class='fas fa-rocket text-6xl text-indigo-500 mb-4'></i><h1 class='text-5xl font-bold text-gray-800'>標題</h1></div>"}
            ]
        `;

        const response = await generateCompletion(app.settings.provider, app.settings.apiKey, app.settings.model, [{role: 'user', content: userPrompt}], systemInstruction);
        const data = parseJsonSafely(response);
        renderPresentation(data);

    } else if (type === 'quiz') {
        const qCount = document.getElementById('labQuestions').value;
        systemInstruction = "你是一個出題老師。請根據來源資料出題。";
        userPrompt += `
            語言: ${lang}
            題目數量: ${qCount} 題
            自訂要求: ${prompt}

            請輸出一個 JSON 陣列，產生單選題。
            格式要求:
            [
              {
                "question": "題目內容？",
                "options": ["選項A", "選項B", "選項C", "選項D"],
                "answerIndex": 0, // 正確選項的索引 (0-3)
                "explanation": "因為..."
              }
            ]
        `;

        const response = await generateCompletion(app.settings.provider, app.settings.apiKey, app.settings.model, [{role: 'user', content: userPrompt}], systemInstruction);
        const data = parseJsonSafely(response);
        renderQuiz(data);
    }
}

function parseJsonSafely(text) {
    try {
        // Remove markdown code blocks if present
        let cleaned = text.replace(/```json/g, '').replace(/```/g, '').trim();
        return JSON.parse(cleaned);
    } catch (e) {
        console.error("JSON parse error on string:", text);
        throw new Error("AI 回傳的格式不正確，無法解析。");
    }
}

// --- Player & TTS Utilities ---

function stopTTS() {
    if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
    }
}

function speakText(text, lang = 'zh-TW', voiceType = 'default') {
    return new Promise((resolve) => {
        if (!window.speechSynthesis) {
            console.warn("Browser does not support TTS");
            resolve();
            return;
        }

        stopTTS();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;

        // Simple voice differentiation hack
        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) {
            let selectedVoice;
            const langVoices = voices.filter(v => v.lang.includes(lang.split('-')[0]));

            if (langVoices.length > 1) {
                if (voiceType === 'guest') {
                    // Try to pick a different voice for guest
                    selectedVoice = langVoices[1];
                } else {
                    selectedVoice = langVoices[0];
                }
            } else {
                selectedVoice = langVoices[0] || voices[0];
            }
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }
        }

        utterance.onend = () => resolve();
        utterance.onerror = (e) => {
            console.error("TTS Error", e);
            resolve();
        };

        window.speechSynthesis.speak(utterance);
    });
}

// Ensure voices are loaded
if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
    };
}

    document.getElementById('closeLabResultBtn').onclick = () => {

function renderVideoExplanation(data) {
    openResultOverlay('影片解說');
    const container = document.getElementById('labResultContent');

    container.innerHTML = `
        <div class="max-w-4xl mx-auto flex flex-col h-full items-center justify-center">

            </div>
            <div class="mt-8 text-center" id="subtitleContainer">
                <p class="text-xl font-medium text-gray-700 bg-white/80 px-6 py-3 rounded-2xl shadow-sm inline-block min-h-[3rem]"></p>

        </div>

    const display = document.getElementById('videoDisplay');
    const subtitle = container.querySelector('#subtitleContainer p');

function renderPodcast(data) {
    openResultOverlay('播客');
    const container = document.getElementById('labResultContent');

    container.innerHTML = `
        <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 flex flex-col h-[80vh]">
            <div class="p-8 bg-gradient-to-r from-blue-600 to-indigo-600 text-white flex justify-between items-center">

                    <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-sm">

                    </div>
                    <div>
                        <h2 class="text-2xl font-bold">AI 播客</h2>

            </div>
        </div>
    `;

    const transcriptDiv = document.getElementById('podcastTranscript');

    // Render lines statically first
    data.forEach((line, index) => {
        const isHost = line.speaker === 'host';
        const el = document.createElement('div');
        el.className = `flex w-full ${isHost ? 'justify-start' : 'justify-end'} opacity-50 transition-opacity duration-300`;
        el.id = `podcast-line-${index}`;

        el.innerHTML = `
            <div class="max-w-[80%] flex ${isHost ? 'flex-row' : 'flex-row-reverse'} gap-3 items-end">
                <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-xs text-white ${isHost ? 'bg-blue-500' : 'bg-indigo-500'}">
                    <i class="fas ${isHost ? 'fa-microphone' : 'fa-user'}"></i>
                </div>
                <div class="p-4 rounded-2xl ${isHost ? 'bg-gray-100 text-gray-800 rounded-bl-sm' : 'bg-indigo-50 text-indigo-900 border border-indigo-100 rounded-br-sm'}">

    });

            return;
        }

        isPlaying = true;
        startBtn.innerHTML = '<i class="fas fa-stop text-xl"></i>';

            if (!isPlaying) break; // Check if stopped

            const line = data[i];

            // Highlight current line

        }

        isPlaying = false;
        startBtn.innerHTML = '<i class="fas fa-play text-xl ml-1"></i>';
    };
}

function renderQuiz(data) {
    openResultOverlay('測驗');
    const container = document.getElementById('labResultContent');

    if (!data || data.length === 0) {
        container.innerHTML = `<div class="text-red-500 p-8">無效的測驗資料</div>`;
        return;
    }

    let html = '<div class="max-w-3xl mx-auto space-y-8 pb-12">';

    data.forEach((q, idx) => {
        html += `
            <div class="bg-white p-8 rounded-3xl shadow-md border border-gray-100 quiz-card">
                <h3 class="text-xl font-bold text-gray-800 mb-6 flex gap-3">
                    <span class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center flex-shrink-0 text-sm shadow-inner">${idx + 1}</span>
                    <span>${q.question}</span>
                </h3>
                <div class="space-y-3 pl-11">
        `;

        q.options.forEach((opt, optIdx) => {
            const id = `q-${idx}-opt-${optIdx}`;
            html += `
                <label class="flex items-center p-4 rounded-xl border-2 border-gray-100 cursor-pointer hover:bg-gray-50 transition-colors relative option-label">
                    <input type="radio" name="q-${idx}" value="${optIdx}" class="w-5 h-5 text-indigo-600 focus:ring-indigo-500">
                    <span class="ml-3 text-gray-700">${opt}</span>
                    <i class="fas fa-check text-emerald-500 absolute right-4 opacity-0 answer-icon-correct text-xl"></i>
                    <i class="fas fa-times text-rose-500 absolute right-4 opacity-0 answer-icon-wrong text-xl"></i>
                </label>
            `;
        });

        html += `
                </div>
                <div class="mt-6 pl-11 hidden explanation">
                    <div class="p-4 bg-amber-50 border-l-4 border-amber-400 rounded-r-xl text-amber-800 text-sm">
                        <strong>解析：</strong>${q.explanation}
                    </div>
                </div>
            </div>
        `;
    });

    html += `
        <div class="text-center mt-10">
            <button id="submitQuizBtn" class="px-10 py-4 bg-indigo-600 text-white rounded-2xl font-bold text-lg hover:bg-indigo-700 transition-all shadow-xl shadow-indigo-600/30 transform hover:-translate-y-1">
                提交答案
            </button>
        </div>
    </div>`;

    container.innerHTML = html;

    document.getElementById('submitQuizBtn').onclick = () => {
        let score = 0;

        data.forEach((q, idx) => {
            const selected = document.querySelector(`input[name="q-${idx}"]:checked`);
            const card = document.querySelectorAll('.quiz-card')[idx];
            const labels = card.querySelectorAll('.option-label');
            const expl = card.querySelector('.explanation');

            // Disable all inputs
            card.querySelectorAll('input').forEach(i => i.disabled = true);
            expl.classList.remove('hidden');

            const correctIdx = q.answerIndex;
            labels[correctIdx].classList.add('border-emerald-500', 'bg-emerald-50');
            labels[correctIdx].querySelector('.answer-icon-correct').classList.remove('opacity-0');

            if (selected) {
                const selectedIdx = parseInt(selected.value);
                if (selectedIdx === correctIdx) {
                    score++;
                } else {
                    labels[selectedIdx].classList.add('border-rose-500', 'bg-rose-50');
                    labels[selectedIdx].querySelector('.answer-icon-wrong').classList.remove('opacity-0');
                }
            }
        });

        const btn = document.getElementById('submitQuizBtn');
        btn.textContent = `得分: ${score} / ${data.length}`;
        btn.classList.replace('bg-indigo-600', 'bg-emerald-500');
        btn.classList.replace('hover:bg-indigo-700', 'hover:bg-emerald-600');
        btn.classList.replace('shadow-indigo-600/30', 'shadow-emerald-500/30');
        btn.disabled = true;
    };
}// js/app.js

class App {
    constructor() {
        this.settings = {
            isSetupComplete: false,
            provider: null,
            apiKey: null,
            model: null,
            language: 'zh-TW'
        };
        this.items = [];
        this.currentNotebookId = null;
        this.sources = [];
        this.activeSourceIds = [];
        this.messages = [];

        // Expose to window for inline onclick handlers (temporary measure, better to use event delegation)
        window.app = this;
    }

    async init() {
        this.showLoading('初始化系統...');
        try {
            await initDB();
            await this.loadSettings();

            if (!this.settings.isSetupComplete) {
                this.hideLoading();
                this.startSetupFlow();
            } else {
                await this.loadWorkspace();
                this.hideLoading();
            }
        } catch (error) {
            console.error("Initialization error:", error);
            alert("初始化失敗，請重新整理頁面。\n錯誤: " + error.message);
            this.hideLoading();
        }
    }

    // --- Loading UI ---
    showLoading(text = '載入中...') {
        document.getElementById('loadingText').textContent = text;
        document.getElementById('loadingOverlay').classList.remove('hidden');
    }

    hideLoading() {
        document.getElementById('loadingOverlay').classList.add('hidden');
    }

    // --- Settings Logic ---
    async loadSettings() {
        const keys = ['isSetupComplete', 'provider', 'apiKey', 'model', 'language'];
        for (const key of keys) {
            const val = await getSetting(key);
            if (val !== null) this.settings[key] = val;
        }
    }

    async updateSetting(key, value) {
        this.settings[key] = value;
        await saveSetting(key, value);
    }

    // --- Setup Flow ---
    startSetupFlow() {
        const modal = document.getElementById('setupModal');
        modal.classList.remove('hidden');

        let currentStep = 1;
        let tempProvider = null;
        let tempApiKey = null;
        let availableModels = [];

        const updateUI = () => {
            // Update steps visibility
            document.getElementById('setupStep1').classList.toggle('hidden', currentStep !== 1);
            document.getElementById('setupStep2').classList.toggle('hidden', currentStep !== 2);
            document.getElementById('setupStep3').classList.toggle('hidden', currentStep !== 3);

            // Update indicators
            const indicators = document.getElementById('setupStepIndicators').children;
            for (let i = 0; i < 3; i++) {
                indicators[i].className = `w-3 h-3 rounded-full ${i + 1 <= currentStep ? 'bg-indigo-600' : 'bg-gray-300'}`;
            }

            // Buttons
            const prevBtn = document.getElementById('setupPrevBtn');
            const nextBtn = document.getElementById('setupNextBtn');

            prevBtn.classList.toggle('hidden', currentStep === 1);

            if (currentStep === 1) {
                nextBtn.textContent = '下一步';
                nextBtn.disabled = !tempProvider;
                renderProviderCards('providerCards', tempProvider, (id) => {
                    tempProvider = id;
                    updateUI(); // Re-render to show selection
                });
            } else if (currentStep === 2) {
                nextBtn.textContent = '驗證並繼續';
                nextBtn.disabled = false;
            } else if (currentStep === 3) {
                nextBtn.textContent = '完成設定';
                nextBtn.disabled = availableModels.length === 0;
            }
        };

        document.getElementById('setupPrevBtn').onclick = () => {
            if (currentStep > 1) currentStep--;
            updateUI();
        };

        document.getElementById('setupNextBtn').onclick = async () => {
            if (currentStep === 1) {
                currentStep++;
                updateUI();
            } else if (currentStep === 2) {
                tempApiKey = document.getElementById('apiKeyInput').value.trim();
                if (!tempApiKey) {
                    alert('請輸入 API 金鑰');
                    return;
                }

                this.showLoading('正在驗證金鑰並獲取模型...');
                try {
                    availableModels = await fetchModels(tempProvider, tempApiKey);
                    renderModelOptions('modelSelect', availableModels);
                    currentStep++;
                    updateUI();
                } catch (error) {
                    alert('驗證失敗: ' + error.message);
                } finally {
                    this.hideLoading();
                }
            } else if (currentStep === 3) {
                const selectedModel = document.getElementById('modelSelect').value;
                if (!selectedModel) {
                    alert('請選擇模型');
                    return;
                }

                // Save settings
                await this.updateSetting('provider', tempProvider);
                await this.updateSetting('apiKey', tempApiKey);
                await this.updateSetting('model', selectedModel);
                await this.updateSetting('isSetupComplete', true);

                modal.classList.add('hidden');

                // Show a quick tour/welcome alert (simple implementation)
                alert('設定完成！歡迎使用 Opensia。\n您可以在左側建立筆記本並上傳文件開始。');

                await this.loadWorkspace();
            }
        };

        updateUI();
    }

    // --- Settings Modal Logic ---
    initSettingsModal() {
        const modal = document.getElementById('settingsModal');
        const openBtn = document.getElementById('openSettingsBtn');
        const closeBtn = document.getElementById('closeSettingsBtn');
        const saveBtn = document.getElementById('saveSettingsBtn');
        const refreshBtn = document.getElementById('settingsRefreshModels');

        const providerSelect = document.getElementById('settingsProvider');
        const apiKeyInput = document.getElementById('settingsApiKey');
        const modelSelect = document.getElementById('settingsModel');
        const langSelect = document.getElementById('settingsLanguage');

        const populateModal = async () => {
            providerSelect.value = this.settings.provider || 'openai';
            apiKeyInput.value = this.settings.apiKey || '';
            langSelect.value = this.settings.language || 'zh-TW';

            if (this.settings.provider && this.settings.apiKey) {
                try {
                    const models = await fetchModels(this.settings.provider, this.settings.apiKey);
                    renderModelOptions('settingsModel', models, this.settings.model);
                } catch (e) {
                    renderModelOptions('settingsModel', []);
                }
            } else {
                renderModelOptions('settingsModel', []);
            }
        };

        openBtn.addEventListener('click', async () => {
            await populateModal();
            modal.classList.remove('hidden');
        });

        closeBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        refreshBtn.addEventListener('click', async () => {
            const provider = providerSelect.value;
            const key = apiKeyInput.value.trim();
            if (!key) {
                alert('請先輸入 API 金鑰');
                return;
            }

            const btnIcon = refreshBtn.querySelector('i');
            btnIcon.classList.add('fa-spin');

            try {
                const models = await fetchModels(provider, key);
                renderModelOptions('settingsModel', models, this.settings.model);
            } catch (e) {
                alert('獲取模型失敗: ' + e.message);
                renderModelOptions('settingsModel', []);
            } finally {
                btnIcon.classList.remove('fa-spin');
            }
        });

        // Clear models if provider changes
        providerSelect.addEventListener('change', () => {
            renderModelOptions('settingsModel', []);
        });

        saveBtn.addEventListener('click', async () => {
            const provider = providerSelect.value;
            const key = apiKeyInput.value.trim();
            const model = modelSelect.value;
            const lang = langSelect.value;

            if (!key || !model) {
                alert('請確保 API 金鑰已輸入且已選擇模型');
                return;
            }

            await this.updateSetting('provider', provider);
            await this.updateSetting('apiKey', key);
            await this.updateSetting('model', model);
            await this.updateSetting('language', lang);

            modal.classList.add('hidden');

            // Re-initialize workspace if needed, though settings usually take effect on next generation
            alert('設定已儲存');
        });
    }

    async loadWorkspace() {
        this.initSettingsModal();

        // Load items from DB
        this.items = await getItems() || [];
        this.renderExplorer();

        // Bind explorer buttons
        document.getElementById('addFolderBtn').onclick = () => this.createNewItem('folder');
        document.getElementById('addNotebookBtn').onclick = () => this.createNewItem('notebook');

        // Bind file upload
        document.getElementById('uploadSourceInput').onchange = (e) => this.handleFileUpload(e);

        // Bind Chat
        document.getElementById('sendChatBtn').onclick = () => this.handleChatSubmit();
        document.getElementById('chatInput').onkeypress = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                this.handleChatSubmit();
            }
        };

        // Mobile sidebar toggle
        document.getElementById('toggleSidebarBtn').onclick = () => {
             const sidebar = document.getElementById('sidebar');
             sidebar.classList.toggle('-translate-x-full');
             sidebar.classList.toggle('absolute');
             sidebar.classList.toggle('h-full');
        };

        // Bind Lab Buttons
        document.querySelectorAll('.lab-btn').forEach(btn => {
            btn.onclick = () => {
                if (this.activeSourceIds.length === 0) {
                    alert('請至少選擇一個來源資料');
                    return;
                }
                const type = btn.dataset.type;
                window.openLabModal(type, this);
            };
        });
    }

    // --- File Explorer Logic ---

    async createNewItem(type) {
        const defaultName = type === 'folder' ? '新資料夾' : '新筆記本';
        const name = prompt(`請輸入${type === 'folder' ? '資料夾' : '筆記本'}名稱:`, defaultName);
        if (!name) return;

        const newItem = {
            id: Date.now().toString(),
            type: type,
            name: name,
            parentId: null, // Flat structure for now
            createdAt: Date.now()
        };

        await addItem(newItem);
        this.items.push(newItem);
        this.renderExplorer();

        if (type === 'notebook') {
            await this.selectNotebook(newItem.id);
        }
    }

    async deleteItem(id) {
        if (!confirm('確定要刪除嗎？')) return;

        await deleteItem(id);
        this.items = this.items.filter(i => i.id !== id);

        if (this.currentNotebookId === id) {
            this.currentNotebookId = null;
            this.updateWorkspaceVisibility();
        }

        this.renderExplorer();
    }

    renderExplorer() {
        renderExplorerItems(
            this.items,
            'fileExplorer',
            this.currentNotebookId,
            (id) => console.log('Folder clicked', id), // Implement expand/collapse if needed
            (id) => this.selectNotebook(id)
        );
    }

    // --- Notebook Workspace Logic ---

    async selectNotebook(id) {
        this.currentNotebookId = id;
        this.activeSourceIds = []; // Reset active sources on switch

        const notebook = this.items.find(i => i.id === id);
        if (notebook) {
            document.getElementById('currentNotebookTitle').textContent = notebook.name;
        }

        this.updateWorkspaceVisibility();

        // Load sources and messages for this notebook
        this.sources = await getSourcesByNotebook(id) || [];
        this.messages = await getMessagesByNotebook(id) || [];

        this.renderSourcesList();
        this.renderChat();
        this.renderExplorer(); // update active state in UI
    }

    updateWorkspaceVisibility() {
        const hasNotebook = !!this.currentNotebookId;
        document.getElementById('mainWorkspace').classList.toggle('hidden', !hasNotebook);
        document.getElementById('emptyWorkspace').classList.toggle('hidden', hasNotebook);
    }

    // --- Sources Logic ---

    async handleFileUpload(event) {
        if (!this.currentNotebookId) return;

        const files = event.target.files;
        if (!files || files.length === 0) return;

        this.showLoading('正在處理文件與使用 AI 擷取內容，這可能需要一些時間...');

        try {
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                let extractedText = '';

                // Simple text extraction based on file type
                if (file.type === 'text/plain' || file.name.endsWith('.md')) {
                    extractedText = await file.text();
                } else if (file.type === 'application/pdf') {
                    // Note: Needs pdf.js integrated properly. For this demo context,
                    // if pdf.js is not fully set up to read text, we simulate it or use a basic fallback.
                    // Assuming pdf.js is loaded globally via CDN in a real app.
                    extractedText = await this.extractPdfText(file);
                } else {
                    alert(`不支援的檔案格式: ${file.name}`);
                    continue;
                }

                if (!extractedText) continue;

                // Send to AI for formatting/summarization as requested
                document.getElementById('loadingText').textContent = `AI 正在整理 ${file.name}...`;

                const summaryText = await summarizeDocument(
                    this.settings.provider,
                    this.settings.apiKey,
                    this.settings.model,
                    extractedText,
                    file.name
                );

                const newSource = {
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    notebookId: this.currentNotebookId,
                    name: file.name,
                    summary: summaryText, // Storing only the formatted text
                    createdAt: Date.now()
                };

                await addSource(newSource);
                this.sources.push(newSource);
                // Auto-select new source
                this.activeSourceIds.push(newSource.id);
            }

            this.renderSourcesList();
        } catch (error) {
            console.error("Upload error:", error);
            alert("處理文件時發生錯誤: " + error.message);
        } finally {
            this.hideLoading();
            event.target.value = ''; // Reset input
        }
    }

    async extractPdfText(file) {
        // A placeholder for actual PDF text extraction using pdf.js
        // For the sake of this implementation, we will mock it if pdfjsLib is not available
        if (typeof pdfjsLib !== 'undefined') {
             try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                let fullText = '';
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    fullText += `[第${pageNum}頁]
${pageText}

`;
                }
                return fullText;
             } catch(e) {
                 console.error("PDF Extraction failed:", e);
                 return `[模擬 PDF 內容] 檔名: ${file.name}\n這是一段無法正常解析的 PDF 內容。`;
             }
        } else {
             return `[模擬 PDF 內容] 檔名: ${file.name}\n因為找不到 pdf.js，這是模擬的擷取文字。請確保頁面有載入 pdf.js。`;
        }
    }

    async deleteSource(id) {
        if (!confirm('確定要刪除此來源嗎？')) return;
        await deleteSource(id);
        this.sources = this.sources.filter(s => s.id !== id);
        this.activeSourceIds = this.activeSourceIds.filter(activeId => activeId !== id);
        this.renderSourcesList();
    }

    toggleActiveSource(id, isActive) {
        if (isActive) {
            if (!this.activeSourceIds.includes(id)) this.activeSourceIds.push(id);
        } else {
            this.activeSourceIds = this.activeSourceIds.filter(activeId => activeId !== id);
        }
        this.renderSourcesList(); // Re-render to update tags in chat
    }

    renderSourcesList() {
        renderSources(
            this.sources,
            'sourcesList',
            this.activeSourceIds,
            (id, active) => this.toggleActiveSource(id, active),
            (id) => this.deleteSource(id)
        );
        this.updateActiveSourcesIndicator();
    }

    updateActiveSourcesIndicator() {
        const container = document.getElementById('activeSourcesIndicator');
        container.innerHTML = '';

        const activeSources = this.sources.filter(s => this.activeSourceIds.includes(s.id));
        if (activeSources.length > 0) {
            activeSources.forEach(s => {
                const tag = document.createElement('span');
                tag.className = 'px-2 py-1 bg-indigo-100 text-indigo-700 text-xs rounded-lg flex items-center gap-1 border border-indigo-200';
                tag.innerHTML = `<i class="fas fa-paperclip"></i> <span class="truncate max-w-[100px]">${s.name}</span>`;
                container.appendChild(tag);
            });
        }
    }

    // --- Chat Logic ---

    async handleChatSubmit() {
        const inputEl = document.getElementById('chatInput');
        const text = inputEl.value.trim();
        if (!text || !this.currentNotebookId) return;

        const btnEl = document.getElementById('sendChatBtn');
        btnEl.disabled = true;
        inputEl.value = '';

        // Get active sources content
        const activeSourcesData = this.sources.filter(s => this.activeSourceIds.includes(s.id));

        // 1. Save user message
        const userMsg = {
            id: Date.now().toString(),
            notebookId: this.currentNotebookId,
            role: 'user',
            content: text,
            timestamp: Date.now()
        };
        await addMessage(userMsg);
        this.messages.push(userMsg);
        this.renderChat();

        // 2. Prepare context for AI
        let systemPrompt = "你是一個有用的學習助手。請根據提供的「來源資料」來回答使用者的問題。如果來源資料中沒有相關資訊，請誠實告知。\n\n";
        if (activeSourcesData.length > 0) {
            systemPrompt += "【來源資料】\n";
            activeSourcesData.forEach(s => {
                systemPrompt += `--- 檔案：${s.name} ---
${s.summary}

`;
            });
        } else {
            systemPrompt += "（使用者目前沒有選擇任何來源資料，請依一般常識回答）";
        }

        // Add a temporary loading message
        const tempMsgId = 'temp_loading';
        this.messages.push({ id: tempMsgId, role: 'assistant', content: '<i class="fas fa-circle-notch fa-spin"></i> 思考中...' });
        this.renderChat();

        // 3. Call AI
        try {
            // Prepare message history (last 10 messages for context)
            const chatHistory = this.messages
                .filter(m => m.id !== tempMsgId)
                .slice(-10)
                .map(m => ({ role: m.role, content: m.content }));

            const responseContent = await generateCompletion(
                this.settings.provider,
                this.settings.apiKey,
                this.settings.model,
                chatHistory,
                systemPrompt
            );

            // Remove temp msg
            this.messages = this.messages.filter(m => m.id !== tempMsgId);

            // 4. Save AI response
            const aiMsg = {
                id: Date.now().toString(),
                notebookId: this.currentNotebookId,
                role: 'assistant',
                content: responseContent,
                sources: activeSourcesData.map(s => ({ id: s.id, name: s.name })), // Attach source metadata
                timestamp: Date.now()
            };

            await addMessage(aiMsg);
            this.messages.push(aiMsg);

        } catch (error) {
            console.error("Chat error:", error);
            this.messages = this.messages.filter(m => m.id !== tempMsgId);
            alert("對話發生錯誤: " + error.message);
        } finally {
            btnEl.disabled = false;
            this.renderChat();
        }
    }

    renderChat() {
        renderChatMessages(this.messages, 'chatHistory');
    }
}

// Bootstrap
document.addEventListener('DOMContentLoaded', () => {
    const app = new App();
    app.init();
});</script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opensia</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Mermaid.js for Mind Maps -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-indigo-50 text-gray-800 font-sans h-screen overflow-hidden flex selection:bg-indigo-200">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/80 z-50 flex items-center justify-center hidden backdrop-blur-sm">
        <div class="text-center">
            <i class="fas fa-circle-notch fa-spin text-4xl text-indigo-600 mb-4"></i>
            <p class="text-indigo-800 font-medium animate-pulse" id="loadingText">載入中...</p>
        </div>
    </div>

    <!-- Setup Modal (First Time) -->
    <div id="setupModal" class="fixed inset-0 bg-slate-900/40 z-40 flex items-center justify-center hidden backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl w-11/12 max-w-3xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-8 border-b border-gray-100 flex justify-between items-center bg-indigo-50/50">
                <h2 class="text-2xl font-bold text-indigo-900 flex items-center gap-3">
                    <i class="fas fa-wand-magic-sparkles text-indigo-500"></i>
                    歡迎來到 Opensia
                </h2>
                <div class="flex gap-2" id="setupStepIndicators">
                    <div class="w-3 h-3 rounded-full bg-indigo-600"></div>
                    <div class="w-3 h-3 rounded-full bg-gray-300"></div>
                    <div class="w-3 h-3 rounded-full bg-gray-300"></div>
                </div>
            </div>

            <div class="p-8 overflow-y-auto flex-grow" id="setupContent">
                <!-- Step 1: Provider Selection -->
                <div id="setupStep1" class="">
                    <h3 class="text-xl font-semibold mb-6 text-gray-700">第一步：選擇 AI 模型供應商</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="providerCards">
                        <!-- Provider cards injected here -->
                    </div>
                </div>

                <!-- Step 2: API Key Input -->
                <div id="setupStep2" class="hidden">
                    <h3 class="text-xl font-semibold mb-6 text-gray-700">第二步：輸入 API 金鑰</h3>
                    <p class="text-gray-500 mb-4" id="providerKeyHelp">請輸入您的 API 金鑰。我們只會將其安全地儲存在您的瀏覽器本地。</p>
                    <div class="relative">
                        <i class="fas fa-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="apiKeyInput" class="w-full pl-12 pr-4 py-4 rounded-2xl border-2 border-indigo-100 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none text-lg" placeholder="sk-...">
                    </div>
                </div>

                <!-- Step 3: Model Selection -->
                <div id="setupStep3" class="hidden">
                    <h3 class="text-xl font-semibold mb-6 text-gray-700">第三步：選擇 AI 模型</h3>
                    <p class="text-gray-500 mb-4">我們已經抓取了可用的模型。請選擇一個：</p>
                    <div class="relative">
                        <i class="fas fa-brain absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <select id="modelSelect" class="w-full pl-12 pr-4 py-4 rounded-2xl border-2 border-indigo-100 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all outline-none text-lg appearance-none bg-white">
                            <option value="">載入中...</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                    </div>
                </div>
            </div>

            <div class="p-6 border-t border-gray-100 bg-gray-50 flex justify-end gap-4 rounded-b-3xl">
                <button id="setupPrevBtn" class="px-6 py-3 rounded-xl font-medium text-gray-600 hover:bg-gray-200 transition-colors hidden">返回</button>
                <button id="setupNextBtn" class="px-8 py-3 rounded-xl font-medium bg-indigo-600 text-white hover:bg-indigo-700 shadow-lg shadow-indigo-600/30 transition-all transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed">下一步</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal (Standalone) -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/40 z-40 flex items-center justify-center hidden backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl w-11/12 max-w-2xl overflow-hidden flex flex-col">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-indigo-50/50">
                <h2 class="text-xl font-bold text-indigo-900 flex items-center gap-3">
                    <i class="fas fa-cog text-indigo-500"></i>
                    設定
                </h2>
                <button id="closeSettingsBtn" class="w-10 h-10 rounded-full hover:bg-white flex items-center justify-center text-gray-500 hover:text-red-500 transition-colors shadow-sm">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-8 overflow-y-auto space-y-6">
                 <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">顯示語言</label>
                    <select id="settingsLanguage" class="w-full p-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none">
                        <option value="zh-TW">繁體中文</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">模型供應商</label>
                    <select id="settingsProvider" class="w-full p-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none">
                        <option value="openai">OpenAI</option>
                        <option value="google">Google Gemini</option>
                        <option value="groq">Groq</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">API 金鑰</label>
                    <div class="flex gap-2">
                         <input type="password" id="settingsApiKey" class="flex-grow p-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none">
                         <button id="settingsRefreshModels" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 transition-colors" title="重新抓取模型">
                             <i class="fas fa-sync-alt"></i>
                         </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">AI 模型</label>
                    <select id="settingsModel" class="w-full p-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none">
                    </select>
                </div>
            </div>
            <div class="p-6 border-t border-gray-100 bg-gray-50 flex justify-end gap-4 rounded-b-3xl">
                <button id="saveSettingsBtn" class="px-6 py-2.5 rounded-xl font-medium bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-md">儲存設定</button>
            </div>
        </div>
    </div>


    <!-- Sidebar (File Explorer) -->
    <aside class="w-72 bg-white border-r border-indigo-100 flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-10 flex-shrink-0 transition-all duration-300" id="sidebar">
        <div class="p-6 border-b border-indigo-50 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-indigo-600 tracking-tight flex items-center gap-2">
                <i class="fas fa-leaf"></i> Opensia
            </h1>
            <button id="openSettingsBtn" class="w-10 h-10 rounded-full hover:bg-indigo-50 flex items-center justify-center text-gray-400 hover:text-indigo-600 transition-colors" title="設定">
                <i class="fas fa-cog"></i>
            </button>
        </div>

        <div class="p-4 flex gap-2">
            <button id="addFolderBtn" class="flex-1 py-2 px-3 bg-indigo-50 text-indigo-700 rounded-xl hover:bg-indigo-100 transition-colors font-medium text-sm flex items-center justify-center gap-2">
                <i class="fas fa-folder-plus"></i> 資料夾
            </button>
            <button id="addNotebookBtn" class="flex-1 py-2 px-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-colors font-medium text-sm flex items-center justify-center gap-2 shadow-md shadow-indigo-600/20">
                <i class="fas fa-book-medical"></i> 筆記本
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-1 custom-scrollbar" id="fileExplorer">
            <!-- Explorer items injected here -->
        </div>
    </aside>

    <!-- Main Workspace (Hidden until notebook selected) -->
    <main class="flex-1 flex flex-col bg-slate-50/50 hidden relative" id="mainWorkspace">

        <!-- Top Bar -->
        <header class="h-16 bg-white/80 backdrop-blur-md border-b border-indigo-100 flex items-center justify-between px-6 z-10">
            <div class="flex items-center gap-4">
                <button id="toggleSidebarBtn" class="w-10 h-10 rounded-xl hover:bg-indigo-50 flex items-center justify-center text-gray-500 transition-colors md:hidden">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 id="currentNotebookTitle" class="text-xl font-semibold text-gray-800">未命名筆記本</h2>
            </div>

            <div class="flex gap-2">
                <button class="lab-btn px-4 py-2 bg-amber-50 text-amber-700 rounded-xl hover:bg-amber-100 transition-colors font-medium text-sm flex items-center gap-2 border border-amber-200/50 shadow-sm" data-type="video">
                    <i class="fas fa-film"></i> <span class="hidden sm:inline">影片解說</span>
                </button>
                <button class="lab-btn px-4 py-2 bg-emerald-50 text-emerald-700 rounded-xl hover:bg-emerald-100 transition-colors font-medium text-sm flex items-center gap-2 border border-emerald-200/50 shadow-sm" data-type="mindmap">
                    <i class="fas fa-project-diagram"></i> <span class="hidden sm:inline">心智圖</span>
                </button>
                <button class="lab-btn px-4 py-2 bg-blue-50 text-blue-700 rounded-xl hover:bg-blue-100 transition-colors font-medium text-sm flex items-center gap-2 border border-blue-200/50 shadow-sm" data-type="podcast">
                    <i class="fas fa-podcast"></i> <span class="hidden sm:inline">播客</span>
                </button>
                <button class="lab-btn px-4 py-2 bg-purple-50 text-purple-700 rounded-xl hover:bg-purple-100 transition-colors font-medium text-sm flex items-center gap-2 border border-purple-200/50 shadow-sm" data-type="presentation">
                    <i class="fas fa-desktop"></i> <span class="hidden sm:inline">簡報</span>
                </button>
                <button class="lab-btn px-4 py-2 bg-rose-50 text-rose-700 rounded-xl hover:bg-rose-100 transition-colors font-medium text-sm flex items-center gap-2 border border-rose-200/50 shadow-sm" data-type="quiz">
                    <i class="fas fa-question-circle"></i> <span class="hidden sm:inline">測驗</span>
                </button>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">

            <!-- Sources Panel (Left side of workspace) -->
            <div class="w-80 bg-white border-r border-indigo-100 flex flex-col z-0 shadow-sm transition-all" id="sourcesPanel">
                <div class="p-4 border-b border-gray-50 flex justify-between items-center bg-gray-50/50">
                    <h3 class="font-semibold text-gray-700 flex items-center gap-2">
                        <i class="fas fa-database text-indigo-400"></i> 來源資料
                    </h3>
                    <label class="cursor-pointer w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center hover:bg-indigo-200 transition-colors shadow-sm" title="上傳文件">
                        <i class="fas fa-plus"></i>
                        <input type="file" id="uploadSourceInput" class="hidden" accept=".txt,.pdf,.md" multiple>
                    </label>
                </div>
                <div class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar" id="sourcesList">
                    <!-- Sources injected here -->
                    <div class="text-center text-gray-400 text-sm mt-10">
                        <i class="fas fa-inbox text-3xl mb-2 opacity-50"></i>
                        <p>尚無來源資料</p>
                        <p class="text-xs mt-1">點擊上方 + 號上傳文件</p>
                    </div>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="flex-1 flex flex-col relative bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9IiNlN2U1ZTRcIi8+PC9zdmc+')] bg-repeat">

                <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar" id="chatHistory">
                    <!-- Chat messages injected here -->
                    <div class="flex items-center justify-center h-full opacity-50">
                        <div class="text-center">
                            <i class="fas fa-sparkles text-4xl text-indigo-300 mb-3"></i>
                            <p class="text-gray-500">選擇來源並開始對話</p>
                        </div>
                    </div>
                </div>

                <!-- Chat Input Container -->
                <div class="p-4 bg-white/80 backdrop-blur-md border-t border-indigo-100">
                    <!-- Active Sources Indicator -->
                    <div class="mb-2 px-2 flex flex-wrap gap-2" id="activeSourcesIndicator">
                        <!-- Active sources tags injected here -->
                    </div>

                    <div class="relative bg-white rounded-3xl shadow-lg border border-indigo-50 focus-within:ring-4 focus-within:ring-indigo-500/20 focus-within:border-indigo-300 transition-all">
                        <textarea id="chatInput" rows="1" class="w-full py-4 pl-6 pr-14 bg-transparent border-none outline-none resize-none max-h-32 custom-scrollbar text-gray-700" placeholder="詢問關於來源的任何問題..."></textarea>
                        <button id="sendChatBtn" class="absolute right-2 bottom-2 w-10 h-10 rounded-2xl bg-indigo-600 text-white flex items-center justify-center hover:bg-indigo-700 transition-colors disabled:opacity-50 shadow-md">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Empty State -->
    <main class="flex-1 flex items-center justify-center bg-slate-50/50 relative" id="emptyWorkspace">
        <div class="text-center max-w-md p-8">
            <div class="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                <i class="fas fa-book-open text-4xl text-indigo-500"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">建立或選擇一個筆記本</h2>
            <p class="text-gray-500 mb-8 leading-relaxed">在左側側邊欄創建一個新的筆記本，上傳您的文件，讓 Opensia 幫助您整理、摘要並產生多樣化的學習內容。</p>
            <button onclick="document.getElementById('addNotebookBtn').click()" class="px-8 py-3 bg-indigo-600 text-white rounded-2xl font-medium hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-600/30 transform hover:-translate-y-1">
                開始使用 <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </div>
    </main>


    <!-- Lab Config Modal -->
    <div id="labModal" class="fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center hidden backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl w-11/12 max-w-lg overflow-hidden flex flex-col">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center" id="labModalHeader">
                <h2 class="text-xl font-bold flex items-center gap-3" id="labModalTitle">
                    <i class="fas fa-flask"></i> 實驗室功能
                </h2>
                <button id="closeLabModalBtn" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 space-y-5" id="labModalBody">
                <!-- Lab config fields injected here dynamically -->
            </div>
            <div class="p-6 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
                <button id="cancelLabBtn" class="px-5 py-2.5 rounded-xl font-medium text-gray-600 hover:bg-gray-200 transition-colors">取消</button>
                <button id="generateLabBtn" class="px-6 py-2.5 rounded-xl font-medium text-white transition-colors shadow-md flex items-center gap-2">
                    <i class="fas fa-magic"></i> 產生
                </button>
            </div>
        </div>
    </div>

    <!-- Lab Result Overlay -->
    <div id="labResultOverlay" class="fixed inset-0 bg-white z-[60] flex flex-col hidden">
        <div class="h-16 border-b border-gray-100 flex items-center justify-between px-6 bg-gray-50">
            <h2 class="text-xl font-bold text-gray-800" id="labResultTitle">產生結果</h2>
            <button id="closeLabResultBtn" class="px-4 py-2 rounded-xl bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 shadow-sm transition-colors flex items-center gap-2 font-medium">
                <i class="fas fa-times"></i> 關閉
            </button>
        </div>
        <div class="flex-1 overflow-auto p-8 bg-slate-50 relative" id="labResultContent">
            <!-- Result content injected here -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/db.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/components.js"></script>
    <script src="js/lab.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
